<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Weakpoint Manhwa Reader</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: system-ui, Segoe UI, Roboto, Arial;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 20px;
            background: #f7f7f7;
        }

        .main {
            max-width: 720px;
            width: 100%;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
            padding: 16px;
        }

        .controls {
            text-align: center;
            margin-bottom: 12px;
        }

        .file-info {
            text-align: center;
            color: #555;
            font-size: 0.95rem;
            margin-bottom: 12px;
        }

        #gallery img {
            width: 100%;
            height: auto;
            display: block;
            margin: 12px auto;
            border-radius: 4px;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .chapter-selector {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: white;
            font-size: 1rem;
            cursor: pointer;
        }

        .nav-btn {
            cursor: pointer;
            display: inline-block;
            padding: 8px 16px;
            border-radius: 6px;
            background: #0078d4;
            color: white;
            font-weight: 600;
            border: none;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .nav-btn:hover {
            background: #106ebe;
        }

        .nav-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            color: #666;
            font-style: italic;
            margin: 20px 0;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="controls">
            <button class="nav-btn" id="prevChapter">← Previous</button>
            <select class="chapter-selector" id="chapterSelector">
                <option value="">Select Chapter...</option>
            </select>
            <button class="nav-btn" id="nextChapter">Next →</button>
        </div>
        <div class="file-info" id="fileInfo">Select a chapter to start reading</div>
        <div id="gallery"></div>
        <div class="loading" id="loading" style="display: none;">Loading images...</div>
    </div>

    <script>
        const gallery = document.getElementById('gallery');
        const chapterSelector = document.getElementById('chapterSelector');
        const loading = document.getElementById('loading');
        const prevBtn = document.getElementById('prevChapter');
        const nextBtn = document.getElementById('nextChapter');
        
        let currentChapter = null;
        let availableChapters = [];
        
        // Generate list of available chapters (1-120)
        function generateChapters() {
            const chapters = [];
            for (let i = 1; i <= 120; i++) {
                chapters.push(i);
            }
            return chapters;
        }
        
        // Populate chapter selector
        function populateChapterSelector() {
            availableChapters = generateChapters();
            
            availableChapters.forEach(chapter => {
                const option = document.createElement('option');
                option.value = chapter;
                option.textContent = `Chapter ${chapter}`;
                chapterSelector.appendChild(option);
            });
        }
        
        function clearGallery() { 
            gallery.innerHTML = ''; 
        }
        
        function showLoading(show = true) {
            loading.style.display = show ? 'block' : 'none';
        }
        
        function updateNavigationButtons() {
            const currentIndex = availableChapters.indexOf(currentChapter);
            prevBtn.disabled = currentIndex <= 0;
            nextBtn.disabled = currentIndex >= availableChapters.length - 1;
        }
        
        // Build a URL relative to this document for chapter images
        function getChapterImageUrl(chapter, filename) {
            // Properly encode the path components
            const encodedChapter = encodeURIComponent(`Chapter ${chapter}`);
            const encodedFilename = encodeURIComponent(filename);
            const chapterPath = `./images/${encodedChapter}/${encodedFilename}`;
            const url = new URL(chapterPath, location.href).href;
            return url;
        }
        
        function pad(num, size) {
            let s = String(num);
            while (s.length < size) s = '0' + s;
            return s;
        }
        
        // Hardcoded mapping of chapter image ranges - VERIFIED against all folders
        const chapterMappings = {
            1: { start: 0, end: 32 },
            2: { start: 33, end: 64 },
            3: { start: 65, end: 95 },
            4: { start: 96, end: 127 },
            5: { start: 128, end: 151 },
            6: { start: 152, end: 172 },
            7: { start: 173, end: 192 },
            8: { start: 193, end: 211 },
            9: { start: 212, end: 229 },

            11: { start: 249, end: 265 },
            12: { start: 266, end: 284 },
            13: { start: 285, end: 303 },
            14: { start: 304, end: 323 },
            15: { start: 324, end: 341 },
            16: { start: 342, end: 360 },
            17: { start: 361, end: 378 },
            18: { start: 379, end: 395 },
            19: { start: 396, end: 414 },
            20: { start: 415, end: 431 },
            21: { start: 432, end: 449 },
            22: { start: 450, end: 467 },
            23: { start: 468, end: 484 },
            24: { start: 485, end: 501 },
            25: { start: 502, end: 517 },
            26: { start: 518, end: 535 },
            27: { start: 536, end: 553 },
            28: { start: 554, end: 570 },
            29: { start: 571, end: 589 },
            30: { start: 590, end: 606 },
            31: { start: 607, end: 625 },
            32: { start: 626, end: 642 },
            33: { start: 643, end: 658 },
            34: { start: 659, end: 675 },
            35: { start: 676, end: 691 },
            36: { start: 692, end: 709 },
            37: { start: 710, end: 725 },
            38: { start: 726, end: 742 },
            39: { start: 743, end: 759 },
            40: { start: 760, end: 776 },
            41: { start: 777, end: 792 },
            42: { start: 793, end: 809 },
            43: { start: 810, end: 826 },
            44: { start: 827, end: 843 },
            45: { start: 844, end: 859 },
            46: { start: 860, end: 876 },
            47: { start: 877, end: 897 },
            48: { start: 898, end: 916 },
            49: { start: 917, end: 934 },
            50: { start: 935, end: 954 },
            51: { start: 0, end: 18 },
            52: { start: 0, end: 17 },

            92: { start: 0, end: 19 },
            93: { start: 0, end: 18 },
            94: { start: 0, end: 20 },
            95: { start: 0, end: 19 },
            96: { start: 0, end: 18 },
            97: { start: 0, end: 17 },
            98: { start: 0, end: 19 },
            99: { start: 0, end: 16 },
            100: { start: 0, end: 17 },
            101: { start: 0, end: 17 },
            102: { start: 0, end: 20 },

            114: { start: 0, end: 17 },
            115: { start: 0, end: 18 },
            116: { start: 0, end: 20 },
            117: { start: 0, end: 18 },
            118: { start: 0, end: 16 },
            119: { start: 0, end: 16 },
            120: { start: 0, end: 15 }
        };
        
        // Load all images from a specific chapter using hardcoded mapping
        function loadChapterImages(chapter) {
            if (!chapter || !chapterMappings[chapter]) {
                fileInfo.textContent = `Chapter ${chapter} - Not found`;
                return;
            }
            
            clearGallery();
            showLoading(true);
            
            const mapping = chapterMappings[chapter];
            const loadedImages = [];
            
            // Generate all images based on the mapping
            for (let i = mapping.start; i <= mapping.end; i++) {
                const filename = `Weakness_${pad(i, 2)}.jpg`;
                const url = getChapterImageUrl(chapter, filename);
                loadedImages.push({ url, filename, index: i });
            }
            
            // Create and append image elements
            loadedImages.forEach(({ url, filename }) => {
                const imgEl = document.createElement('img');
                imgEl.src = url;
                imgEl.alt = `Chapter ${chapter} - ${filename}`;
                imgEl.loading = 'lazy';
                gallery.appendChild(imgEl);
            });
            
            showLoading(false);
        }
        
        // Event listeners
        chapterSelector.addEventListener('change', (e) => {
            const selectedChapter = parseInt(e.target.value);
            if (selectedChapter) {
                currentChapter = selectedChapter;
                loadChapterImages(selectedChapter);
                updateNavigationButtons();
            }
        });
        
        prevBtn.addEventListener('click', () => {
            const currentIndex = availableChapters.indexOf(currentChapter);
            if (currentIndex > 0) {
                const prevChapter = availableChapters[currentIndex - 1];
                currentChapter = prevChapter;
                chapterSelector.value = prevChapter;
                loadChapterImages(prevChapter);
                updateNavigationButtons();
            }
        });
        
        nextBtn.addEventListener('click', () => {
            const currentIndex = availableChapters.indexOf(currentChapter);
            if (currentIndex < availableChapters.length - 1) {
                const nextChapter = availableChapters[currentIndex + 1];
                currentChapter = nextChapter;
                chapterSelector.value = nextChapter;
                loadChapterImages(nextChapter);
                updateNavigationButtons();
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' && !prevBtn.disabled) {
                prevBtn.click();
            } else if (e.key === 'ArrowRight' && !nextBtn.disabled) {
                nextBtn.click();
            }
        });
        
        // Initialize on page load
        window.addEventListener('DOMContentLoaded', () => {
            populateChapterSelector();
            updateNavigationButtons();
        });
    </script>
</body>

</html>
